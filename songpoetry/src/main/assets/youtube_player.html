<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#player{margin:0;width:100%;height:100%;background:#000;overflow:hidden}</style></head><body><div id="player"></div><script src="https://www.youtube.com/iframe_api"></script><script>
let player=null;
function onYouTubeIframeAPIReady(){player=new YT.Player('player',{width:'100%',height:'100%',playerVars:{playsinline:1,controls:1,rel:0},events:{onReady:()=>AndroidBridge.ready(),onStateChange:e=>AndroidBridge.state(e.data)}})}
function loadVideo(id){if(player)player.loadVideoById(id)}
function playVideo(){if(player)player.playVideo()}
</script></body></html>
