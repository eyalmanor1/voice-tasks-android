name: Temporary Song Poetry APK Build
on:
  push:
    branches: [ "main" ]
jobs:
  build-song-poetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: song-poetry-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - run: gradle :songpoetry:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: song-poetry-apk
          path: songpoetry/build/outputs/apk/debug/songpoetry-debug.apk
