name: Build Song Poetry APK
on:
  push:
    branches: [ "song-poetry-build" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Build APK
        run: gradle :songpoetry:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: song-poetry-apk
          path: songpoetry/build/outputs/apk/debug/songpoetry-debug.apk
